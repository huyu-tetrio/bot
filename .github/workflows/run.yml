name: Feeder Bot
on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install playwright playwright-extra puppeteer-extra-plugin-stealth
      - run: npx playwright install chromium
      - name: Run bot
        env:
          BOT_EMAIL: ${{ secrets.BOT_EMAIL }}
          BOT_PASS: ${{ secrets.BOT_PASS }}
        run: node bot.js
