name: Feeder Bot
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install playwright playwright-extra puppeteer-extra-plugin-stealth
      - run: npx playwright install chromium
      - name: Run bot
        env:
          BOT_EMAIL: ${{ secrets.BOT_EMAIL }}
          BOT_PASS: ${{ secrets.BOT_PASS }}
          ROOM_URL: ${{ secrets.ROOM_URL }}
          ROOM_PASS: ${{ secrets.ROOM_PASS }}
          ADMIN_TRIP: ${{ secrets.ADMIN_TRIP }}
        run: node bot.js
